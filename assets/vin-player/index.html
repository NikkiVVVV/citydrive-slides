<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIN · Документы и автомобиль</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="player.css?v=3">
  <script defer src="../slide-10/gsap.min.js"></script>
  <script defer src="../slide-10/number-help-scene.js"></script>
  <script defer src="../slide-10/vin-preview.js?v=3"></script>
  <script defer src="player.js?v=2"></script>
</head>
<body>
  <main class="player">
    <header class="player-header">
      <h1>VIN <span>Документы и автомобиль</span></h1>
      <div class="segmented" role="group" aria-label="Тема">
        <button type="button" data-theme-option="light" aria-pressed="false">Светлая</button>
        <button type="button" data-theme-option="dark" aria-pressed="true">Тёмная</button>
      </div>
    </header>
    <div class="player-versions" hidden>
      <span>Версии</span>
      <ol aria-label="Версии анимации VIN">
        <li aria-current="true">V7 · Документы и автомобиль</li>
        <li>V7.1 · Без переворота</li>
        <li>V7.2 · Точки и волна</li>
        <li>V7.3 · Тентованный LCV</li>
      </ol>
    </div>
    <div class="player-tools">
      <div class="segmented" role="group" aria-label="Вид">
        <button type="button" data-mode="canvas" aria-pressed="true">Холст</button>
        <button type="button" data-mode="mockup" aria-pressed="false">Мокап</button>
      </div>
      <div class="segmented" role="group" aria-label="Где искать номер">
        <button type="button" data-source="document" aria-pressed="true">Документ</button>
        <button type="button" data-source="vehicle" aria-pressed="false">Автомобиль</button>
      </div>
    </div>
    <section class="stage" data-view="canvas" aria-label="Просмотр анимации">
      <div class="stage-device">
        <div class="stage-screen">
          <div class="mockup-ui" hidden>
            <div class="stage-notch" aria-hidden="true"></div>
            <p>Где найти номер</p>
            <div class="mockup-tabs" aria-label="Номер">
              <button type="button" data-time="5.8" aria-pressed="false">VIN</button>
              <button type="button" data-time="13.2" aria-pressed="false">Кузов</button>
              <button type="button" data-time="9.6" aria-pressed="false">Шасси</button>
            </div>
          </div>
          <div id="scene"></div>
        </div>
      </div>
    </section>
    <div class="transport">
      <button type="button" id="play" aria-label="Воспроизвести" title="Воспроизвести">▶</button>
      <button type="button" id="reset" aria-label="Сначала" title="Сначала">↺</button>
      <input id="scrub" type="range" min="0" max="15.6" step="0.01" value="0" aria-label="Позиция воспроизведения">
      <output id="time" for="scrub">0,0 / 15,6 с</output>
      <label class="speed">
        <span>Скорость</span>
        <select id="speed" aria-label="Скорость"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option></select>
      </label>
    </div>
    <div class="chapters" aria-label="Сцены">
      <p>Сцены</p>
      <div class="segmented">
        <button type="button" data-time="0" aria-pressed="true">Стартовый кадр</button>
        <button type="button" data-time="5.8" aria-pressed="false">VIN</button>
        <button type="button" data-time="9.6" aria-pressed="false">Номер шасси</button>
        <button type="button" data-time="13.2" aria-pressed="false">Номер кузова</button>
        <button type="button" data-time="15.2" aria-pressed="false">Документ целиком</button>
      </div>
    </div>
  </main>
</body>
</html>
