  <template id="mcp-breakdown-slide">
    <dl class="breakdown-copy mcp-breakdown-copy">
      <div>
        <dt>Поворот</dt>
        <dd>Белая карточка профиля разворачивается вокруг вертикальной оси, открывая цветную сторону.</dd>
      </div>
      <div>
        <dt>Перелив</dt>
        <dd>По&nbsp;цветной стороне проходит голографический блик. Под&nbsp;ним проступает защитный узор, а&nbsp;портрет меняет оттенок.</dd>
      </div>
      <div>
        <dt>Сдвиг</dt>
        <dd>По&nbsp;нажатию открывается экран проверки, и&nbsp;бейдж становится большой карточкой в&nbsp;верхней части экрана.</dd>
      </div>
      <div>
        <dt>Плавная смена текста</dt>
        <dd>Список под&nbsp;карточкой размывается и&nbsp;исчезает. На&nbsp;его месте появляется пояснение о&nbsp;проверке личности.</dd>
      </div>
      <div>
        <dt>Параллакс</dt>
        <dd>При&nbsp;наклоне карты блик смещается по&nbsp;её поверхности. За&nbsp;счёт этого карта выглядит объёмной.</dd>
      </div>
      <div>
        <dt>Характер движения</dt>
        <dd>По&nbsp;оценке 60fps, движение замедляется к&nbsp;концу и&nbsp;слегка пружинит. В&nbsp;описании также сказано, что карта реагирует на&nbsp;наклон телефона. По&nbsp;записи видно движение, а&nbsp;его связь с&nbsp;гироскопом не&nbsp;подтверждена.</dd>
      </div>
    </dl>
    <figure class="mcp-breakdown-preview">
      <video src="assets/ideas-references/airbnb-verification.mp4" poster="assets/ideas-references/airbnb-verification-poster.jpg"
